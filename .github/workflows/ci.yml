name: CI
'on': push

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v7
              with: 
                go-version-file: 'go.mod'
            - name: Prepare Scryfall Dataset
              run: go run ./cmd/prepare-data
            - name: Run tests
              run: go test ./...
            - name: Build
              run: go build ./...

